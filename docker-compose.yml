services:
  db:
    image: mysql:8.0
    container_name: botica_db
    restart: unless-stopped
    
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Lima
    volumes:
      - db_data:/var/lib/mysql                      
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [botica_net]


  backend:
    build: ./backend
    container_name: botica_backend
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=-05:00
      - --sql-mode=STRICT_ALL_TABLES,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --max-connections=100
      - --innodb-buffer-pool-size=268435456
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks: [botica_net]

  frontend:
    build: ./frontend
    container_name: botica_frontend
    restart: unless-stopped
    depends_on: [backend]
    networks: [botica_net]

  nginx:
    image: nginx:alpine
    container_name: botica_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, backend]
    networks: [botica_net]

volumes:
  db_data:

networks:
  botica_net: